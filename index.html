<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ZenSocial</title><style>
:root{--bg:#f7f8fc;--card:rgba(255,255,255,.78);--text:#171821;--muted:#7b7f8e;--line:#e7e8ef;--accent:#8b5cf6;--shadow:0 15px 45px rgba(40,45,75,.09)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 10% 8%,#91d7ff,transparent 28%),radial-gradient(circle at 90% 10%,#f8a8ca,transparent 28%),radial-gradient(circle at 50% 100%,#8ebcff,transparent 34%),linear-gradient(135deg,#bde9ff,#f5c9dc 45%,#9ac7ff);color:var(--text);min-height:100vh}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}
.glass{background:rgba(255,255,255,.45);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,.65);box-shadow:0 18px 45px rgba(38,66,110,.14)}
.top{position:sticky;top:0;z-index:20;padding:14px 18px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.22);backdrop-filter:blur(22px);border-bottom:1px solid rgba(255,255,255,.4)}
.brand{font-weight:900;font-size:22px;color:#1e1b4b}.top .spacer{flex:1}
.icon{width:42px;height:42px;border-radius:15px;background:rgba(255,255,255,.48);font-size:19px;border:1px solid rgba(255,255,255,.6)}
.shell{display:flex;max-width:1180px;margin:auto}
.side{width:220px;padding:22px 12px;position:sticky;top:68px;height:calc(100vh - 68px)}
.navbtn{width:100%;padding:13px 15px;border-radius:18px;background:transparent;text-align:left;margin:4px 0;color:#475569;font-weight:600}
.navbtn.active,.navbtn:hover{background:rgba(255,255,255,.65);color:#1e1b4b;box-shadow:0 8px 25px rgba(40,45,75,.06)}
.main{width:100%;max-width:680px;padding:20px 14px 100px;margin:auto}
.right{width:250px;padding:22px 12px}
.card{border-radius:26px;padding:18px;margin-bottom:18px}
.input{width:100%;padding:13px 14px;border:1px solid rgba(255,255,255,.6);border-radius:18px;background:rgba(255,255,255,.5);margin:6px 0;outline:none}
.primary{background:linear-gradient(135deg,#5eb8ff,#7968f5);color:white;padding:12px 17px;border-radius:16px;font-weight:800;box-shadow:0 9px 24px rgba(121,104,245,.3)}
.muted{color:#64748b}
.avatar{width:52px;height:52px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#13b9ff,#775cf4,#ff8cad);display:grid;place-items:center;font-weight:800;color:white}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid white}
.media{width:100%;max-height:620px;object-fit:cover;border-radius:22px;margin-top:13px}
.actions{display:flex;gap:12px;margin-top:10px}
.actions button{background:transparent;padding:8px 12px;border-radius:14px;font-size:18px}
.bottom{display:none;position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:30;width:min(calc(100% - 22px),475px);padding:7px;border-radius:27px;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.65);backdrop-filter:blur(30px);justify-content:space-around;box-shadow:0 20px 55px rgba(39,70,106,.2)}
.bottom button{background:transparent;padding:8px 14px;font-size:20px;border-radius:16px;color:#475569}
@media(max-width:900px){.side,.right{display:none}.main{padding-top:14px}.bottom{display:flex!important}.top{padding-left:12px}.main{max-width:700px}}
</style></head><body><div id="root"></div><script src="app.js"></script></body></html>
