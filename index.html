<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ZenSocial</title><style>
:root{--bg:#f7f8fc;--card:rgba(255,255,255,.78);--text:#171821;--muted:#7b7f8e;--line:#e7e8ef;--accent:#665cff;--shadow:0 15px 45px rgba(40,45,75,.09)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#f9fbff,#f4f1ff);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.glass{background:var(--card);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow)}.top{position:sticky;top:0;z-index:10;padding:12px 18px;display:flex;align-items:center;gap:12px;background:rgba(247,248,252,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{font-weight:900;font-size:22px;letter-spacing:-.7px}.top .spacer{flex:1}.icon{width:42px;height:42px;border-radius:14px;background:white;border:1px solid var(--line);font-size:19px}.shell{display:flex;max-width:1180px;margin:auto}.side{width:220px;padding:22px 12px;position:sticky;top:68px;height:calc(100vh - 68px)}.navbtn{width:100%;padding:13px 15px;border-radius:15px;background:transparent;text-align:left;margin:4px 0;color:#545866}.navbtn.active,.navbtn:hover{background:white;color:var(--text);box-shadow:0 8px 25px rgba(40,45,75,.06)}.main{width:100%;max-width:680px;padding:20px 14px 100px;margin:auto}.right{width:250px;padding:22px 12px}.card{border-radius:24px;padding:16px;margin-bottom:15px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(420px,100%);padding:28px;border-radius:30px}.input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:15px;background:white;margin:6px 0;outline:none}.primary{background:var(--accent);color:white;padding:12px 17px;border-radius:14px;font-weight:800}.secondary{background:#f0f1f7;padding:11px 14px;border-radius:13px}.muted{color:var(--muted)}.posthead{display:flex;gap:10px;align-items:center}.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#ddd,#fff);display:grid;place-items:center;font-weight:800}.media{width:100%;max-height:620px;object-fit:cover;border-radius:19px;margin-top:13px;background:#eef0f6}.actions{display:flex;gap:8px;margin-top:10px}.actions button{background:transparent;padding:8px 10px;border-radius:12px}.actions button:hover{background:#f1f2f7}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{padding:10px 14px;border-radius:13px;background:#eeeef5}.tab.active{background:var(--text);color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.grid img,.grid video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.modal{position:fixed;inset:0;background:rgba(20,22,30,.35);display:grid;place-items:center;z-index:30;padding:18px}.modalbox{width:min(500px,100%);max-height:90vh;overflow:auto;border-radius:26px;padding:20px}.row{display:flex;align-items:center;gap:10px}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}.hide{display:none!important}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat div{padding:15px;border-radius:18px;background:#f2f3f8;text-align:center}.adminnav{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.adminnav button{padding:10px 13px;border-radius:12px;background:#f0f1f6}.table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.danger{color:#d33}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#171821;color:#fff;padding:12px 18px;border-radius:15px;z-index:99}@media(max-width:900px){.side,.right{display:none}.main{padding-top:14px}.bottom{display:flex!important}.top{padding-left:12px}.main{max-width:700px}}.bottom{display:none;position:fixed;bottom:0;left:0;right:0;z-index:20;padding:8px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);justify-content:space-around;border-top:1px solid var(--line)}.bottom button{background:transparent;padding:7px;font-size:20px}.small{font-size:13px}
</style><style>
body{background:radial-gradient(circle at 10% 0%,#eeeaff 0,#f8f9ff 35%,#f4f5fa 100%);transition:.3s}
button{transition:transform .15s,box-shadow .15s,background .15s}
button:active{transform:scale(.96)}
.top{height:70px;padding:10px 22px;background:rgba(255,255,255,.72);box-shadow:0 4px 25px rgba(30,30,60,.05)}
.brand{font-size:24px;letter-spacing:-1px}
.icon{background:rgba(255,255,255,.8);box-shadow:0 5px 18px rgba(40,45,75,.06)}
.side{padding:26px 14px}
.navbtn{font-weight:650;padding:14px 16px}
.navbtn.active{background:linear-gradient(135deg,#fff,#f1efff);color:var(--accent);box-shadow:0 10px 28px rgba(40,45,75,.08)}
.main{padding:28px 18px 110px}
.card{border-radius:26px;padding:18px;margin-bottom:18px}
.card.glass{background:rgba(255,255,255,.68);box-shadow:0 18px 50px rgba(35,40,75,.08)}
.primary{box-shadow:0 9px 24px rgba(102,92,255,.25)}
.primary:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(102,92,255,.32)}
.input{background:rgba(255,255,255,.82);padding:14px;border-radius:17px}
.media{border-radius:22px}
.avatar{box-shadow:0 4px 15px rgba(30,30,60,.12)}
.actions button{font-weight:650}
.actions button:hover{transform:translateY(-1px)}
.bottom{padding:10px 6px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.78)}
.bottom button{min-width:48px;border-radius:15px}
@media(max-width:900px){
.top{height:64px}
.main{padding:18px 12px 100px}
.card{border-radius:22px}
}
</style></head><body><div id="root"></div><script src="app.js"></script></body></html>
