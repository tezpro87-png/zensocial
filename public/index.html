<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ZenSocial Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --bg: #000000;
  --card-bg: #121212;
  --text: #f5f5f5;
  --muted: #a8a8a8;
  --border: #262626;
  --accent: #0095f6;
  --verified: #3897f0;
  --danger: #ed4956;
}
body.light-theme { --bg: #ffffff; --card-bg: #f8f9fa; --text: #000000; --muted: #65676b; --border: #dbdbdb; }
body.glass-theme { --bg: linear-gradient(135deg, #0f2027, #203a43, #2c5364); --card-bg: rgba(255, 255, 255, 0.1); --text: #ffffff; --border: rgba(255,255,255,0.2); }

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: var(--bg); color: var(--text); padding-bottom: 60px; min-height: 100vh; }

.top-nav { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--border); height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
.brand-logo { font-size: 20px; font-weight: 800; }
.page-section { display: none; padding: 12px; max-width: 500px; margin: 0 auto; }
.page-section.active { display: block; }

.user-card { background: var(--card-bg); border: 1px solid var(--border); padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
.user-actions button { padding: 6px 10px; border: none; border-radius: 4px; font-weight: 600; font-size: 11px; cursor: pointer; margin-left: 2px; }
.btn-verify { background: var(--verified); color: white; }
.btn-ban { background: var(--danger); color: white; }
.btn-manager { background: #9c27b0; color: white; }

.post-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
.post-header { padding: 10px; display: flex; align-items: center; justify-content: space-between; }
.verified-icon { color: var(--verified); font-size: 12px; margin-left: 4px; }
.post-media { width: 100%; max-height: 450px; object-fit: cover; display: block; }

.setting-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.setting-input { width: 100%; padding: 10px; margin: 8px 0; background: var(--card-bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; }

.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: var(--bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
.tab-btn { background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; }
</style>
</head>
<body>

<div class="top-nav">
  <div class="brand-logo">ZenSocial</div>
  <div style="display:flex; gap:16px; align-items:center;">
    <i class="fa-solid fa-crown" onclick="switchTab('adminSection')" style="color:#ffd700; cursor:pointer;"></i>
    <i class="fa-regular fa-paper-plane" onclick="switchTab('dmSection')"></i>
  </div>
</div>

<!-- 1. FEED -->
<div class="page-section active" id="feedSection"><div id="feedContainer"></div></div>

<!-- 2. SEARCH & USER PROFILE SEARCH -->
<div class="page-section" id="searchSection">
  <input type="text" class="setting-input" placeholder="Search friends & accounts..." id="searchInput">
</div>

<!-- 3. UPLOAD MEDIA -->
<div class="page-section" id="createSection">
  <h3>Create Post / Reel</h3>
  <input type="text" class="setting-input" id="mediaUrl" placeholder="Image/Video URL...">
  <input type="text" class="setting-input" id="postCaption" placeholder="Caption...">
  <button style="width:100%; padding:10px; background:var(--accent); border:none; color:white; border-radius:6px;" onclick="alert('Post Published!')">Publish</button>
</div>

<!-- 4. ADMIN PANEL -->
<div class="page-section" id="adminSection">
  <h3><i class="fa-solid fa-user-shield"></i> Admin Management</h3>
  <div id="adminUserList" style="margin-top:12px;"></div>
</div>

<!-- 5. SETTINGS & GHOST MODE -->
<div class="page-section" id="settingsSection">
  <h3>Account Settings</h3>
  <input type="text" class="setting-input" placeholder="Change Username">
  <input type="password" class="setting-input" placeholder="Change Password">
  <button style="width:100%; padding:8px; background:var(--accent); border:none; color:white; border-radius:6px; margin-bottom:12px;">Save Profile</button>

  <div class="setting-item">
    <span>Ghost Mode (Hide Online)</span>
    <input type="checkbox" onchange="alert('Ghost Mode updated!')">
  </div>
  <div class="setting-item">
    <span>Theme</span>
    <select onchange="document.body.className=this.value+' -theme'" class="setting-input" style="width:auto;">
      <option value="dark">Dark</option>
      <option value="light">Light</option>
      <option value="glass">Glassmorphism</option>
    </select>
  </div>
</div>

<div class="bottom-bar">
  <button class="tab-btn" onclick="switchTab('feedSection')"><i class="fa-solid fa-house"></i></button>
  <button class="tab-btn" onclick="switchTab('searchSection')"><i class="fa-solid fa-magnifying-glass"></i></button>
  <button class="tab-btn" onclick="switchTab('createSection')"><i class="fa-regular fa-square-plus"></i></button>
  <button class="tab-btn" onclick="switchTab('adminSection')"><i class="fa-solid fa-user-gear"></i></button>
  <button class="tab-btn" onclick="switchTab('settingsSection')"><i class="fa-regular fa-gear"></i></button>
</div>

<script>
function switchTab(id) {
  document.querySelectorAll('.page-section').forEach(e => e.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id === 'adminSection') loadAdminPanel();
  if(id === 'feedSection') loadFeed();
}

async function loadFeed() {
  const res = await fetch('/api/posts');
  const posts = await res.json();
  document.getElementById('feedContainer').innerHTML = posts.map(p => `
    <div class="post-card">
      <div class="post-header">
        <div><b>${p.username}</b>${p.isVerified ? '<i class="fa-solid fa-circle-check verified-icon"></i>' : ''}</div>
      </div>
      <img src="${p.mediaUrl}" class="post-media">
      <div style="padding:10px;">
        <i class="fa-regular fa-heart" style="font-size:20px;"></i>
        <p style="margin-top:4px; font-size:13px;"><b>${p.username}</b> ${p.caption}</p>
      </div>
    </div>
  `).join('');
}

async function loadAdminPanel() {
  const res = await fetch('/api/users');
  const users = await res.json();
  document.getElementById('adminUserList').innerHTML = users.map(u => `
    <div class="user-card">
      <div>
        <b>${u.username}</b> ${u.isVerified ? '<i class="fa-solid fa-circle-check verified-icon"></i>' : ''}
        <div style="font-size:11px; color:var(--muted);">${u.role.toUpperCase()} | ${u.isBanned ? 'Banned' : 'Active'}</div>
      </div>
      <div class="user-actions">
        <button class="btn-verify" onclick="adminAction('${u.username}', 'verify', ${!u.isVerified})">${u.isVerified ? 'Unverify' : 'Verify'}</button>
        <button class="btn-manager" onclick="adminAction('${u.username}', 'role', '${u.role === 'manager' ? 'user' : 'manager'}')">Manager</button>
        <button class="btn-ban" onclick="adminAction('${u.username}', 'ban', ${!u.isBanned})">${u.isBanned ? 'Unban' : 'Ban'}</button>
      </div>
    </div>
  `).join('');
}

async function adminAction(targetUsername, action, value) {
  await fetch('/api/admin/action', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ targetUsername, action, value })
  });
  loadAdminPanel();
}

loadFeed();
</script>
</body>
</html>
